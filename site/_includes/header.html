<header class="site-header band">
  <div class="container site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>
      {% include mark.html size=22 class="brand__mark" %}
      <span class="brand__name">slop-check</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul class="site-nav__list">
        <li><a class="site-nav__link" href="{{ '/setup/' | relative_url }}"{% if page.url contains '/setup/' %} aria-current="page"{% endif %}>Setup</a></li>
        <li><a class="site-nav__link" href="{{ '/usage/' | relative_url }}"{% if page.url == '/usage/' %} aria-current="page"{% endif %}>Usage</a></li>
        <li><a class="site-nav__link" href="{{ '/contribute/' | relative_url }}"{% if page.url == '/contribute/' %} aria-current="page"{% endif %}>Contribute</a></li>
        <li><a class="site-nav__link" href="{{ site.repository_url }}">GitHub</a></li>
      </ul>
      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Dark theme" title="Dark theme" hidden>
        <svg width="18" height="18" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="7.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.75 A7.25 7.25 0 0 1 10 17.25 Z" fill="currentColor"/></svg>
      </button>
    </nav>
  </div>
</header>
