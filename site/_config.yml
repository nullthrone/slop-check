# Jekyll configuration for the slop-check documentation site.
# Built by .github/workflows/pages.yml with actions/jekyll-build-pages (source ./site).

title: slop-check
description: >-
  Style-pattern audit and cleanup for text, plus prevention rules for image prompts.
  An Agent Skills package for Claude, Gemini, ChatGPT, Copilot and other assistants.
url: https://nullthrone.github.io
baseurl: /slop-check
lang: en

repository_url: https://github.com/nullthrone/slop-check
releases_url: https://github.com/nullthrone/slop-check/releases
# Release assets (.github/workflows/release.yml). The pages link to these keys.
# Folder slop-check/ at the zip root, with scripts.
download_zip: https://github.com/nullthrone/slop-check/releases/latest/download/slop-check.zip
# The same files with SKILL.md at the zip root.
download_flat_zip: https://github.com/nullthrone/slop-check/releases/latest/download/slop-check-flat.zip
# SKILL.md and references/ at the zip root, no scripts.
download_lite_zip: https://github.com/nullthrone/slop-check/releases/latest/download/slop-check-lite.zip
# At most 7,500 characters, for instruction fields of about 8,000 characters.
download_instructions: https://github.com/nullthrone/slop-check/releases/latest/download/instructions.md
# Full single-file catalog, for knowledge and project files.
download_knowledge: https://github.com/nullthrone/slop-check/releases/latest/download/knowledge.md
# About 62,000 characters, for API system messages and large fields.
download_prompt: https://github.com/nullthrone/slop-check/releases/latest/download/system-prompt.md
# Same file as download_knowledge, under the key some pages use.
knowledge_url: https://github.com/nullthrone/slop-check/releases/latest/download/knowledge.md
kofi_url: https://ko-fi.com/tsprock

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  # Keep straight quotes and apostrophes in the rendered pages.
  smart_quotes: ["apos", "apos", "quot", "quot"]
  syntax_highlighter_opts:
    disable: true

permalink: pretty

defaults:
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .jekyll-cache
  - .sass-cache
  - README.md
