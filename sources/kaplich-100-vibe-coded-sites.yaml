notes: >
  Author ran 100 sites taken from showcase pages of Lovable, v0, Bolt, Mocha and similar services
  through his own checking tool (promotional). Reports default or placeholder favicons and outdated
  copyright years ("showing 2024 copyright dates when we're now in 2025"), especially on uncustomized
