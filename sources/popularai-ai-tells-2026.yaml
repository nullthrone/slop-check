notes: >
  Newsletter essay listing ten tells with invented examples; no data. Cites neither tropes-fyi
  nor the Wikipedia guide (its references are vendor documents and research on RLHF and
  sycophancy). Entries used here: "The 'let's narrow this down' reflex" ("We are narrowing the
  scope." "We are defining parameters."), "The compulsory warm-up lap" (AI writing "cannot resist
  clearing its throat before it does anything": "Certainly.", "Here's a structured way to think
  about it.") and "The list that looks shrink-wrapped" ("Five reasons. Seven lessons. Nine
  insights." "The number changes. The energy does not.").
