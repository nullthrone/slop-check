notes: >
  Trade-press summary of the Y Combinator design-review episode; derived from it and from the same
  publisher as sej-ai-fingerprints, so it adds no independence. Lists "five examples of generic design
  trends", including "Using bento-box layouts without originality" and "Generic visual elements like
  the example of the software dashboard". Mistake 2 ("Unexpected User Interaction Feedback"): cursor-
  following effects, "Superfluous background animation effects", "Automatic fade-ins", hover effects
  that move things without purpose. Mistake 3: scroll hijacking, "Clickable-looking elements that do
  not behave clearly" and hover-only interactions.
