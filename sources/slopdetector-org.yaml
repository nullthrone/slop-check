title: "Signs of AI Writing: 12 Patterns With Reproducible Thresholds"
url: https://slopdetector.org/blog/signs-of-ai-writing
publisher: SlopDetector
published: 2026-07-31
accessed: 2026-11-17
type: blog
notes: >
  Practitioner article by the makers of a slop detection tool, with a numeric threshold per pattern.
  Values cited here: transition-word stacking (more than half of the paragraphs open with a formal
  connector), deletion test (more than a third of the sentences can be removed without information
  loss), burstiness (coefficient of variation of sentence length below 0.4; human prose typically
  0.6 to 1.2), em dash density (more than 20 per 1,000 words in short modern prose; human baseline
  3.7 to 10 per 1,000). Also published under the title "12 Signs of AI Writing: Patterns and
  Thresholds". A separate em dash article by the same publisher ("Is the Em Dash an AI Tell?",
  2026-07-31) is cited on em-dash-inflation. Neither page carries a byline. Both credit E. M.
  Freeburg's study (arxiv-2603-27006) for the controlled em dash measurement: this article in its
  source list for GPT-4.1 at 10.62 em dashes per 1,000 words against a human control of 3.23, the
  em dash article for all of its model figures (GPT-4.1, Claude, DeepSeek, Gemini, Llama) and the
  3.23 baseline. The em dash article's own measurement is a human baseline of 4.76 per 1,000 words
  in 702,939 words of public-domain literature.
