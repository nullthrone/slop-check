publisher: Velox Themes
authors: ["Widya Bayu W"]
published: 2026-11-04
accessed: 2026-11-18
type: blog
notes: >
  Launch checklist for sites built with AI coding agents, from a vendor of website templates and
  sections (commercial interest in the "generic AI look" framing). Section "What AI-built sites get
  wrong before launch" lists "Made-up claims. Badges, numbers, client logos and reviews that nobody
  gave the AI". Check 1 states: "AI fills empty space with \"500+ happy clients\", five-star ratings
  and logos of companies you never worked with" and "Placeholder text like lorem ipsum, \"Your
  Company\" or example.com, and buttons that go nowhere, often survive until launch"; its agent
  prompt asks to find "links set to \"#\"" and buttons with no action. The SEO check says AI "often
  leaves every page with the same title, or the framework's default". Opens with a client asking
  where a "Trusted by 2,000 teams" badge came from. Practitioner experience, no measurement.
