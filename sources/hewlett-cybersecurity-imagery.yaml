id: hewlett-cybersecurity-imagery
title: "The sorry state of cybersecurity imagery"
url: https://hewlett.org/?p=11406751
publisher: William and Flora Hewlett Foundation
published: 2019-07-25
accessed: 2026-11-17
type: blog
notes: >
  Foundation article (first published on Lawfare) announcing the Cyber Visuals Challenge with
  OpenIDEO and the report "Reimagining Visuals for Cybersecurity" (interviews and focus groups with
  security experts and visual creators). Describes the clichés: men in hoodies, sometimes with
  burglar masks, looming over keyboards; "green Matrix-style 1s and 0s"; glowing locks and server
  racks; "hackers-in-hoodies visual clichés".
