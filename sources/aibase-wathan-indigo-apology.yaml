notes: >
  AI news site reporting a post by the Tailwind CSS creator on 2025-08-07: "I'd like to formally apologize
  for making every button in Tailwind UI use bg-indigo-500 five years ago", "which caused every
  AI-generated interface on Earth to turn indigo" (quoted as reported; 684,000 views). Reports reactions
  attributing the purple preference to tools defaulting to Tailwind CSS. A framework author's joking
  statement relayed secondhand; it is evidence that the indigo default is widely recognized, not a
  measurement. Derived from wathan-indigo-apology-tweet.
