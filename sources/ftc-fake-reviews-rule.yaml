id: ftc-fake-reviews-rule
title: "Federal Trade Commission Announces Final Rule Banning Fake Reviews and Testimonials"
url: https://www.ftc.gov/news-events/news/press-releases/2024/08/federal-trade-commission-announces-final-rule-banning-fake-reviews-testimonials
publisher: U.S. Federal Trade Commission
published: 2024-08-14
accessed: 2026-11-18
type: documentation
notes: >
  Regulator press release on the final rule: prohibits creating or selling reviews or testimonials
  that "misrepresent that they are by someone who does not exist, such as AI-generated fake reviews",
  and buying or disseminating them when the business knew or should have known. Evidence for why
  invented testimonials matter (legal exposure in the US), not evidence that generated pages show
  them.
