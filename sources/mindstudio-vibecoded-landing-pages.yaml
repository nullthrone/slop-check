notes: >
  Vendor blog (no named author; editor credited). Says a prompt for "a clean SaaS landing page"
  yields the same hero ("a gradient or blob background, and a single centered call-to-action
  button"), a feature section that is "a three or four item grid with an icon, a bolded word, and
  one sentence of description", "repeated with no variation in rhythm or hierarchy", and "the same
  rounded-corner card layout everyone else gets". Qualitative; cites no study.
