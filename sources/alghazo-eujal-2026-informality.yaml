id: alghazo-eujal-2026-informality
title: "Informality features in AI-generated and human-written academic discourse"
url: https://doi.org/10.1515/eujal-2025-0055
publisher: European Journal of Applied Linguistics (De Gruyter)
authors: [Sharif Alghazo, Ghaleb Rabab'ah, Dina El-Dakhs, Mohd Nour Al Salem]
published: 2026-06-23
accessed: 2026-11-17
type: peer-reviewed
access_note: >
  Only the abstract was read (via the Crossref metadata record of the DOI); the publisher page
  refused automated requests and the full text with per-feature counts was not read.
notes: >
  Corpus comparison of 40 human-written argumentative essays from the Louvain Corpus of Native
  English Essays (LOCNESS) with 40 ChatGPT essays produced under standardised prompts, using 12
  informality markers. The AI essays "contained significantly fewer informal markers, avoiding
  most conversational elements such as contractions, second-person pronouns, and fragments", while
  overusing sentence-initial conjunctions; chi-square tests significant for nearly all features.
  Academic register only, small corpus.
