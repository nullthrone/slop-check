notes: >
  Blog of an AI website builder (commercial interest: promotes its own pipeline). Says sites from
  single-prompt builders share the "Same stock photos" and lists "Stock photos with no connection to
  your industry or location" as a sign of generic generation. Cites template copy such as "Welcome
  to [Business Name], your trusted plumbing professionals" and flags invented contact data such as
  "555-" phone numbers and "info@businessname.com" email formats.
