  were confirmed on a republication by the UC Berkeley School of Information dated 2024-08-16. The
  original publication date on theatlantic.com was not visible (August 2024 by the repost).
notes: >
  Feature on the default look of image generators: "bright and saturated" colors, "dramatic"
  lighting, idealized beautiful people, surfaces "blurred or airbrushed", an "odd blend of cartoon
  and dreamscape" for unspecific prompts, plus errors such as extra fingers. A digital-forensics
  researcher attributes the "ethereal quality" largely to aesthetic filters applied to training
  inputs and outputs; vendors point to training data and human raters.
