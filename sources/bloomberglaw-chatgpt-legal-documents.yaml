id: bloomberglaw-chatgpt-legal-documents
title: "Detecting ChatGPT in Legal Documents Is Easier Than You Think"
url: https://news.bloomberglaw.com/us-law-week/detecting-chatgpt-in-legal-documents-is-easier-than-you-think
publisher: Bloomberg Law
authors: [Oliver Roberts]
published: 2026-07-07
accessed: 2026-11-17
type: press
notes: >
  Commentary ("Insight") by a law school author. Describes "a URL ending in 'utm_source=chatgpt.com'"
  as a telltale sign that a link "likely passed through ChatGPT", and names seven documents
  carrying the tag: four US federal court opinions and three government documents (an IRS
  publication, a congressional letter and a US International Trade Commission report). Two
  further documents show other drafting artifacts, one of them a pasted assistant line ("Here's a
  revised version of that paragraph with this shift in emphasis"). No total count; the cases are
  examples.
