notes: >
  Developer essay: "every other Figma template, Framer site, or AI SaaS builder inserts three generic
  avatars and plugs in a set of randomly generated quotes". Describes the anatomy of such a
  testimonial: "First name + last name (often a placeholder-sounding combo)", "Generic title
  (Marketing Lead, VP of Growth, Product Manager)" and "a painfully vague quote praising efficiency,
  productivity, or 'our team's synergy'". Opinion, no measurement; covers templates and AI builders
  together.
