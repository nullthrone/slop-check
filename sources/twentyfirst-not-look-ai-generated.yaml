id: twentyfirst-not-look-ai-generated
title: "How to make a website not look AI generated"
url: https://21st.dev/blog/website-not-look-ai-generated
publisher: 21st.dev
published: 2026-08-21
accessed: 2026-11-18
type: blog
notes: >
  Blog of a UI component registry (promotes its own components). Says generated pages are
  "usually competent" and that the complaint is sameness: "the same three sections in the same
  order"; a hero of "Purple to blue, centred headline, two buttons, a soft glow behind"; "Three
  feature cards with three icons and three sentences of equal length"; "Every generated layout is a
  grid of equal cells"; recommends "Break the symmetry once" (for example a bento with a genuinely
  larger cell, an off-centre hero). No study, no counts.
