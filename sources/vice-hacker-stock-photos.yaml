id: vice-hacker-stock-photos
title: "Think Stock Photos of Hackers Are Cheesy? Blame This Guy"
url: https://www.vice.com/en/article/stock-photos-hackers/
publisher: VICE
published: 2016-11-25
accessed: 2026-11-17
type: press
notes: >
  Interview with a stock photographer behind widely used hacker images: "a dark hooded figure
  leaning menacingly over a laptop", black hoodie and balaclava hunched over a keyboard, "some
  abstract illustration of a padlock surrounded by The Matrix typography". The photographer
  explains the persistence by demand for an instantly readable symbol.
