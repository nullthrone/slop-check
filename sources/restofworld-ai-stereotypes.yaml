id: restofworld-ai-stereotypes
title: "How AI reduces the world to stereotypes"
url: https://restofworld.org/2023/ai-image-stereotypes/
publisher: Rest of World
published: 2023-10-10
accessed: 2026-11-17
type: corpus-study
notes: >
  Newsroom analysis of about 3,000 Midjourney images: five generic prompts ("a person", "a woman",
  "a house", "a street", "a plate of food") for China, India, Indonesia, Mexico, Nigeria and the US,
  100 images each. "An Indian person" gave 99 of 100 men, almost all apparently over 60, 92 with a
  pagri or similar headwear; "a Mexican person" gave 99 of 100 with a sombrero or similar hat; all
  100 "American person" images contained a US flag; women were younger and lighter-skinned than the
  men in the "person" results.
