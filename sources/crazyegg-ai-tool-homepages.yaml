id: crazyegg-ai-tool-homepages
title: "Your AI App's Homepage Could Be Costing You Millions: In-House Study & Top CRO Experts Weigh In"
url: https://www.crazyegg.com/blog/ai-tool-homepages/
publisher: Crazy Egg
authors: ["Daniel Mowinski"]
published: 2025-09-23
accessed: 2026-11-18
type: commercial-study
notes: >
  33 unmoderated UserTesting sessions on the homepages of six AI products (not pages shown to be
  generated). 57% of respondents did not trust the claims; one said "The testimonials sound like fake
  quotes"; another questioned a "3x increase" stat; 67% were frustrated by the absence of in-product
  examples such as dashboard screenshots. Evidence for how visitors react to unsupported proof and
  missing product imagery, not for what generated pages contain.
