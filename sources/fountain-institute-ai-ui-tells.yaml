notes: >
  Design-school article ("Published 7 months ago", no calendar date). Seven tells with a training-data
  explanation each: "Neon color palette" ("Neon-on-dark is overrepresented in 'modern UI' training data");
  "Dark mode glow-up" ("Radial gradients behind hero content appear constantly in gaming, crypto, and AI
  product sites"); "Emojis everywhere" (emoji used "as visual punctuation"); "Purple gradients"
  ("Purple-to-blue is statistically the most common gradient in tech product marketing", claim without
  data); "Cards, on cards, on cards"; multicoloured side tabs; status dots. Practitioner opinion.
