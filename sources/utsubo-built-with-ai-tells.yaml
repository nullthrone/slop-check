notes: >
  Design-studio blog. Visual-style signals: an "indigo-to-violet gradient" on hero background, primary
  button and icon accents as "The single most reliable tell"; "Inter is a genuinely good typeface. It's
  also the default in nearly every AI builder", flagged when used alone without a deliberate pairing;
  "Feature lists led by emoji"; equal cards with a 16px corner radius. Agency opinion with secondhand
  statistics. A 925studios page shares sentences with it (see 925studios-ai-slop-design-tells).
