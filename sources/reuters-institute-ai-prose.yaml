notes: >
  Explainer built on interviews with two linguists and a media-literacy expert and on published
  word-frequency studies. Used here only for the linguist Karolina Rudnicka's observation that
  ChatGPT and Grammarly, when asked to review drafts, "also avoid slang, contractions (like
  'gonna' and 'wanna'), colloquial language and passive voice"; qualitative, no counts.
