notes: >
  Marketing-agency blog (sells websites to financial advisors; has a stake). Says forms in
  vibe-coded sites "might look fine but often fail to actually submit & store data" and names
  "Contact forms, quote request forms, booking widgets" as fragile; "Vibe coding tools rarely
  produce accessible markup" with "Missing alt text on images, poor heading hierarchy, inadequate
  color contrast, no keyboard navigation support". Opinion, no measurement.
