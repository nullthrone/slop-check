id: arxiv-2609-23090
title: >-
  How Did Writing Change At CHI? Analyzing 44 Years of CHI Writing Before and After the
  Introduction of Large Language Models
url: https://arxiv.org/abs/2609.23090
publisher: arXiv
published: 2026-09-19
accessed: 2026-11-17
type: academic-preprint
notes: >
  Corpus study of CHI conference papers. Findings used by the legacy knowledge base: decline of
  the function words of, a, an, is, are (read by the authors as modifiers moving into noun
  phrases); rise of across, into, where, while, beyond; booster vocabulary up from 42.5 to 49.4
  on the study's own scale (2025 to 2026) while hedges stay stable; em dashes up from 1.21 to
  2.08 per 1,000 tokens (marked provisional by the authors). Caveats: one edited academic
  register only; the authors note that the break coincides with the removal of the CHI page
  limit in 2021.
