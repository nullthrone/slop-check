id: sun-icml-2025-fingerprints
title: "Idiosyncrasies in Large Language Models"
url: https://arxiv.org/abs/2502.12150
publisher: ICML 2025 proceedings
published: 2025-02-17
accessed: 2026-11-17
type: peer-reviewed
notes: >
  The legacy knowledge base knew this study only through skill-better-ai-writing ("Sun et al.,
  ICML 2025", 97.1 % accuracy). Identified at migration by venue, first-author surname and that
  figure; arXiv v1 dated 2025-02-17, published at ICML 2025. Five-way classification of ChatGPT,
  Claude, Grok, Gemini and DeepSeek output reaches 97.1 % on held-out data; the first token alone
  gives roughly 50 % (chance 20 %). The paper reports that ChatGPT begins responses with
  "certainly" and "below is" and traces the idiosyncrasies to word-level distributions.
