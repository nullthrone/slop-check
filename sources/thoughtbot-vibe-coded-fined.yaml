notes: >
  Consultancy blog auditing one vibe-coded site: "over fifty (FIFTY!) instances of very low
  contrast" (section headers 2.77:1, footer 1.7:1), twelve form-label problems (labels not
  associated with controls), ten text instances at 10px or smaller, AIM score 2.7/10. Says
  accessibility "is an area where AI and vibe coding tools seriously under perform". Single case;
  the firm sells redesign work.
