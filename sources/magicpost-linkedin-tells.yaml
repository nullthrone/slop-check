notes: >
  Blog of a LinkedIn post-writing tool, summarising the tells creators and readers associate with
  AI posts in 2026: em dashes, "Here's how / Here's what", "It's not X, it's Y", a reveal bridge
  ("The result?", "Plot twist:"), a generic advice frame ("Stop X. Start Y.") and the closing
  question, described as "The reflex ask for comments" with the example "What about you?". Quotes a
  creator checklist (attributed to Allie K. Miller) that includes "ending a post with a weird
  question". Says a closing question added about 3 % reach in 2025 (its own analysis, method not
  shown). Cites neither tropes-fyi nor the Wikipedia guide. Vendor interest in AI-assisted posts.
