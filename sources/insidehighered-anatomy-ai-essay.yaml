id: insidehighered-anatomy-ai-essay
title: "Anatomy of an AI Essay"
url: https://www.insidehighered.com/opinion/career-advice/teaching/2024/07/02/ways-distinguish-ai-composed-essays-human-composed-ones
publisher: Inside Higher Ed
authors: [Elizabeth Steere]
published: 2024-07-02
accessed: 2026-11-17
type: press
notes: >
  Teaching column by a literature instructor who had ChatGPT 3.5 and Grammarly's free generative
  tool each write more than 50 analytical essays on early American literature (February 2024) from
  her own course prompts and compared them with the student essays she knows. Unquantified.
  Statements used here: "AI-generated essays are often list-like" and "may feature numbered body
  paragraphs or multiple headings and subheadings"; paragraphs "often begin with formulaic
  transitional phrases" (one essay ran Firstly, In contrast, Furthermore, On the other hand, In
  conclusion); "AI-produced texts frequently use metaphors, sometimes awkwardly" (writing as
  "weaving" a "rich" or "intricate tapestry").
