id: better-images-of-ai-guide
title: "Better Images of AI: A Guide for Users and Creators"
url: https://blog.betterimagesofai.org/wp-content/uploads/2023/02/Better-Images-of-AI-Guide-Feb-23.pdf
publisher: Leverhulme Centre for the Future of Intelligence and We and AI
published: null
accessed: 2026-11-17
type: documentation
notes: >
  Guide published February 2023 (citation year 2023, file dated Feb 23) from a year-long research
  project with roundtables and workshops involving over 100 experts, funded by the UK Arts and
  Humanities Research Council. Elements to avoid: the colour blue, descending code, the human brain,
  science fiction references, white robots, white men in suits, anthropomorphism, variations on The
  Creation of Adam ("touching hands makes AI seem mystical and unknowable"). Recommends honesty,
  humanity, necessity and specificity, and showing people working with concrete technology.
