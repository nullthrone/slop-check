id: firstsales-ai-cold-emails
title: "How Prospects Spot AI-Written Cold Emails"
url: https://firstsales.io/blog/how-prospects-spot-ai-written-emails/
publisher: FirstSales
published: 2026-06-12
accessed: 2026-11-17
type: blog
notes: >
  Sales-tool vendor blog (byline "FirstSales Team") on the signals by which recipients recognise
  AI-written cold emails. Lists generic openers, including "Hope this finds you well...", that
  fail because "Buyers have seen every one of these hundreds of times", and proposes the test
  whether a first sentence "could appear word-for-word in an email to a different person at a
  different company". Other tells named: em dashes, uniform structure, the word "noticed" in fake
  personalization, vocabulary such as "leverage", "robust", "seamless", "elevate", and compliment
  openers. No data.
