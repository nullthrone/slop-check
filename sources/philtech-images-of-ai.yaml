id: philtech-images-of-ai
title: "Images of Artificial Intelligence: a Blind Spot in AI Ethics"
url: https://doi.org/10.1007/s13347-022-00498-3
publisher: Philosophy & Technology (Springer)
authors: [Alberto Romele]
published: 2022-01-29
accessed: 2026-11-17
type: peer-reviewed
notes: >
  Philosophy & Technology 35:4 (2022), open access. Analyses stock images used in science
  communication about AI, "characterized by an excessive use of blue color and recurrent subjects,
  such as androgyne faces, half-flesh and half-circuit brains, and variations on Michelangelo's The
  Creation of Adam"; also "unreal holographic interfaces", "lines of code waving in space", "robots
  tapping on smart touchscreens". Cited by the Better Images of AI guide; written independently of it.
