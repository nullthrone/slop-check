id: openart-visual-cliches
title: "6 Visual Clichés That Scream 'Made by AI' (And What to Do Instead)"
url: https://openart.ai/blog/visual-cliches-that-scream-made-by-ai/
publisher: OpenArt
published: 2026-05-29
accessed: 2026-11-17
type: blog
notes: >
  Blog of an image-generation platform. Six clichés with prompt counter-measures: plastic poreless
  skin ("every pore airbrushed away"), golden-hour lighting applied regardless of scene logic,
  dead-center symmetrical composition, over-detailed surfaces ("a busy maximalism with no rest for
  the eye"), a generically beautiful averaged face ("symmetrical, ageless, conventionally
  attractive"), unmotivated background blur ("cinema-grade bokeh"). States that current models
  render legible text well.
