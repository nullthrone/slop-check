notes: >
  Conversion-optimization guide about landing pages built with AI tools (no author, no date; footer
  (c) 2026). Section "3. Hallucinated or borrowed proof" names the tell as "invented testimonials,
  placeholder logos still sitting in the bar, or a precise stat with no source", with the examples
  "trusted by 10,000 teams" and "increase conversions 312%", and explains that "The model filled the
  proof slot with a confident guess." Its pre-publish checklist asks that every stat have a citable
  source, every testimonial be real and attributed to a named person, and "All placeholder logos and
  dummy quotes removed". Practitioner opinion from a CRO service, no measurement.
