notes: >
  A YC partner and a product designer review submitted startup sites they describe as vibe coded. On
  feature tiles: "these like kind of like bento bento boxes is is not a bad pattern. But it's also
  very non-original", tiles with "icon at the top. And then a bit of text" in "a 3x two" grid,
  followed by quotes, "frequently asked questions and then more gradients"; "I think we just keep
  seeing a lot of these common patterns". On a product visual: "every fake dashboard looks basically
  like ... something like that". On stacked "10x" stats: "everything 10x just feels made up". Also a
  "Valued and trusted by" logo section and purple gradients. Expert commentary on a self-selected
  sample, no counts.
