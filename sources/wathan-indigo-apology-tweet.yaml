notes: >
  Framework author's statement: "I'd like to formally apologize for making every button in
  Tailwind UI `bg-indigo-500` five years ago, leading to every AI generated UI on earth also being
  indigo." Quotes a post "So, GPT-5 hasn't solved the "purple problem"". About 1.5 million views.
  A tongue-in-cheek remark, not a measurement, but it ties the generated look to an unmodified
  default utility class from Tailwind's own examples. Widely retold (e.g. dev.to, prg.sh); those
  retellings are derived from it.
