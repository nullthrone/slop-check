id: calo-chi-ea-2026-semantic-accessibility
title: "Measuring the Semantic Accessibility Gap in LLM-Generated Web UIs"
url: https://iris.polito.it/retrieve/handle/11583/3008330/983056
publisher: ACM (CHI EA '26)
authors: [Tommaso Calò, Alexandra-Elena Gurita, Luigi De Russis]
published: 2026-04-13
accessed: 2026-11-18
type: peer-reviewed
derived_from: []
notes: >
  DOI 10.1145/3772363.3799364; open repository copy (Politecnico di Torino) read. 300 web UIs
  generated by claude-sonnet-4, gemini-2.5-flash and gpt-4o from real-world website prompts were
  judged by LLM judges (validated by fault injection, recall 80-92%) for attributes that pass
  automated checks but carry no meaning. 541 semantic violations (about 1.8 per UI): generic
  button labels 27% ("Submit", "Click"), vague link text 26% ("Read more", "Learn more"), poor alt
  text 20% (alt="image"), ARIA issues 14%, generic form labels 12%. Per-UI rates differ strongly
  by model (figure: Claude 0.3, Gemini 1.5, GPT 1.8). Human annotation (4 annotators) had only fair
  agreement (kappa about 0.24), so borderline cases are subjective. Shares an author with
  gurita-vatavu-w4a-2025.
