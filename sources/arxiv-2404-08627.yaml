title: "Is ChatGPT Transforming Academics' Writing Style?"
url: https://arxiv.org/abs/2404.08627
publisher: arXiv
authors: [Mingmeng Geng, Roberto Trotta]
published: 2024-04-12
accessed: 2026-11-17
