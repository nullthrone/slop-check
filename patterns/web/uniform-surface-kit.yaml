    locator: "calibration traits, item 4; motion section"
    note: "'the SaaS-card kit: ... identical rounded cards, one border-radius on everything regardless of hierarchy, the same soft grey shadow (rgba(0,0,0,.1)) under each'; 'hover transitions on every card are the generic default'."
  - source: impeccable-design-skill
    locator: "rule registry, gpt-thin-border-wide-shadow; animate.md"
    note: "'Every card of this row wears a hairline border paired with a wide, diffuse shadow, which is a recurring generated-UI signature'; 'A generic fade-and-rise, hover lift ... is not a thesis'."
  - source: hallmark-design-skill
    locator: "references/gates.md gate 11, F7, F24"
    note: "'the same lift or scale on every card'; 'one container recipe stamped on six or more selectors'; 'a hairline border under a wide soft shadow'."
  - source: ux-skill-anti-slop-ban-list
    locator: "ban list entries on radius and shadow"
    note: "'border-radius: 12px on every element regardless of context'; 'box-shadow: 0 20px 60px rgba(0,0,0,0.3) on cards that don't actually float'."
  - source: saastr-gemini-3-vibe-coded-look
    locator: "list of telltale signs"
    note: "'Rounded corners everywhere', 'The same card shadows', 'cards with shadows, rounded corners'."
  - source: arxiv-2603-13036
    locator: "section 5.4.2"
    note: "Generated output 'uses generic web styles—such as standard drop shadows or rounded corners' instead of a brand's sharp edges and high-contrast borders."
  - source: jcarterjohnson-vibecoded-design-tells
    locator: "README findings"
    note: "shadcn/Tailwind defaults lead the ranking of complained-about features (shares not read)."
