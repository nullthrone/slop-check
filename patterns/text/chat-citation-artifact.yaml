id: chat-citation-artifact
modality: text
name: Chat citation and link artifacts
summary: >
  Machine traces that a chat assistant adds to sources survive copy and paste: links carry the
  tracking parameter "utm_source=chatgpt.com" or "utm_source=openai", and citation tokens of the
  interface such as ":contentReference[oaicite:2]{index=2}" or a bare "oaicite" appear in the text
  or in reference URLs. They show that links or passages were taken from a chat answer without
  editing, and in reference lists they often mark sources nobody opened.
category: formatting
status: candidate
detector:
  kind: regex
  position: any
threshold:
  min_count: 1
  comparison: gte
  scope: text
requires: null
realizations:
  en:
    patterns:
      - '(?i)[?&]utm_source=(?:chatgpt\.com|openai)\b'
      - '(?i)(?::?contentReference\[)?\boaicite\b(?::\d{1,3}\])?(?:\{index=\d{1,3}\})?'
    examples:
      positive:
        - "Source: https://www.example.org/reports/2026-outlook?utm_source=chatgpt.com"
        - "The agency revised its forecast in March. :contentReference[oaicite:2]{index=2}"
        - "See the filing guidance (https://www.example.gov/pub/guide.pdf?utm_source=openai) for details."
        - "Enrollment grew by 12 percent after the policy change contentReference[oaicite:1]."
      negative:
        - "Read the launch post at https://shop.example.com/blog?utm_source=newsletter&utm_medium=email."
        - "In GA4, filter the session source for chatgpt.com to see referrals from ChatGPT."
        - "The utm_source parameter tells the analytics tool which site sent the visitor."
        - "OpenAI published the citation guidelines for its search product in a help-center article."
legitimate_use: >
  Analytics and SEO writing explains these parameters, and reporting on AI misuse quotes them; such
  texts discuss the strings rather than carry them in their own links. A link copied from a chat
  answer can still point to a real, checked source: the parameter shows the path the link took, not
  that the surrounding prose was generated, so treat a hit as a prompt to verify the citations.
fix: >
  Remove the tracking parameter from every URL and delete the citation tokens. Open each cited
  source, confirm that it exists and supports the claim, and replace the link with a clean,
  canonical URL or a proper reference.
prevention: >
  Never paste links or citations from a chat answer unchecked. Strip tracking parameters and
  interface tokens, and cite only sources you have opened.
notes: >
  Mechanism: technical residue of the chat interface's source handling, not a style choice.
  Closest existing pattern: format-bleed (unrendered markdown such as asterisks, hash signs or pipe
  tables). Markdown is a general markup language that any writer may use; these strings are
  generated by one product's citation and link tracking and have no human use in running text. The
  Wikipedia guide notes that other assistants add their own referrer parameters; only the ChatGPT
  strings read in the sources are in the detector. Bloomberg Law reports that ChatGPT may append
  the parameter to links it provides, and the Originality.ai study reports that the tag occurs on
  some, not all, of its links, so its absence proves nothing.
sources:
  - source: wikipedia-signs-of-ai-writing
    locator: "Citations: 'utm_source='; Markup irregularities (exposed citation markup)"
    note: >
      ChatGPT "may add utm_source=openai or utm_source=chatgpt.com" to source URLs; exposed internal
      citation markup such as contentReference[oaicite:1] is called a more unambiguous sign. The
      guide adds that the parameter shows tool involvement, not that the writing is generated.
  - source: bloomberglaw-chatgpt-legal-documents
    locator: "whole article"
    note: "utm_source=chatgpt.com found in four federal court opinions and three government documents."
  - source: originality-sec-filings-chatgpt-links
    locator: "key findings"
    note: "44 SEC filing documents from January to June 2026 contained utm_source=chatgpt.com."
  - source: politifact-maha-ai-citations
    locator: "section on the report's citations"
    note: "Relays the Washington Post finding that some citations of a May 2025 government report included \"oaicite\" in their URLs."
related:
  - {id: format-bleed, relation: distinct-from}
  - {id: assistant-self-reference, relation: distinct-from}
