    locator: "T2.17 Synonym Cycling / Zwanghafter Bezeichnungswechsel (admitted 2026-09-20)"
  - source: tropes-fyi
    locator: "entry 'Synonym cycling' (/tropes/synonym-cycling)"
    note: "Single-source observation from 2026-08-30 until two further sources were found."
  - source: aipromptindex-io
    locator: "entry 'Synonym Cycling'"
    note: "Rotating different words for the same thing (agent, assistant, tool, system) instead of repeating the clear term."
  - source: skill-no-ai-slop
    locator: "entry 'Synonym cycling'"
    note: "Rotating terms unnecessarily instead of repeating the precise word."
  - source: skill-avoid-ai-writing
    locator: "entry 'Synonym cycling'"
    note: "Nearly identical example; fourth source that led to core admission on 2026-09-20."
related:
