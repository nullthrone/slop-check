  - {date: 2026-09-06, change: "Opened as candidate T2.17 with three sources (tropes.fyi, aipromptindex.io, no-ai-slop skill)."}
  - {date: 2026-09-20, change: "Admitted to legacy knowledge base core as T2.17 (tier 2) after a fourth source (avoid-ai-writing skill); self-calibrated threshold of at least 3 labels for one referent within a paragraph."}
