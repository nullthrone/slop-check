notes: >
  The threshold (three or more labels per referent within one paragraph) is self-calibrated in the
  legacy knowledge base by analogy with T2.4 and T2.9; no source quantifies it. Demarcation: this
  pattern concerns referent consistency whatever words are used, while german-stock-phrases
  targets phrase clichés and hallmark-vocabulary a fixed word list. A broad catalog checked on
  2026-09-20 did not list the pattern, recorded as negative evidence in the legacy knowledge base.
