notes: >
  The threshold is self-calibrated in the legacy knowledge base by analogy with T2.6 and T2.9; no
  source quantifies it. Demarcation: inflated-importance exaggerates a real event, while this
  pattern invents an actor role for an abstract noun regardless of any significance framing.
