  - {date: 2026-08-16, change: "vrid.ai confirms model-dependent opener formulas (ChatGPT, Claude, Gemini)."}
  - {date: 2026-09-20, change: "Academic framing as RLHF-induced stance added via better-ai-writing-skills (citing Yakura et al.); no change to threshold or examples."}
  - {date: 2026-11-15, change: "Pangram corpus data confirms the example list ('Certainly! Here's a': 94 AI vs 0 human)."}
