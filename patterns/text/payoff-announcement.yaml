id: payoff-announcement
modality: text
name: Empty payoff announcement
summary: >
  A rhetorical announcement of a punchline or revelation placed before the point itself ("Here's
  the kicker:", "But here's the thing", "Und hier kommt der Clou:", "Was die wenigsten wissen:").
  The announcement builds suspense that the content rarely earns.
category: rhetoric
status: core
provisional: true
legacy_id: T1.6
legacy_tier: 1
detector:
  kind: regex
  position: any
threshold:
  min_count: 1
  comparison: gte
  scope: text
  context_overrides:
    informal: {min_count: 2}
requires: null
realizations:
  en:
    patterns:
      - '(?i)\b(?:but\s+|and\s+|so\s+)?here[’'']?s\s+the\s+(?:kicker|thing|catch|twist|deal|rub|secret|truth|crazy\s+part|best\s+part|funny\s+part|interesting\s+part|wild\s+part|surprising\s+part|real\s+(?:question|problem|issue|story|kicker))\s*[:.,!—–]'
      - '(?i)\bhere[’'']?s\s+what\s+(?:nobody|no\s+one|most\s+people|few\s+people|many\s+people)\s+(?:(?:don[’'']?t|doesn[’'']?t|won[’'']?t)\s+)?(?:tells?\s+you|tell\s+you|talks?\s+about|reali[sz]es?|knows?|gets?\s+wrong|understands?|mentions?)\b'
      - '(?i)(?:^|(?<=[.!?]\s)|(?<=^[-*•]\s))what\s+(?:nobody|no\s+one|most\s+people|few\s+people|many\s+people)\s+(?:(?:don[’'']?t|doesn[’'']?t)\s+)?(?:tells?\s+you|tell\s+you|talks?\s+about|reali[sz]es?|know|knows|understands?|mentions?)(?:\s*[:,]|\s+is\s*[:,]|\s+is\s+(?:this|that)\b)'
      - '(?i)(?:^|(?<=[.!?]\s)|(?<=^[-*•]\s))(?:and\s+|but\s+)?the\s+(?:best|worst|craziest|wildest|scariest|funniest|most\s+surprising|most\s+interesting|real|biggest|kicker|catch)(?:\s+(?:part|bit|news|surprise|takeaway|twist))?\s*:'
      - '(?i)\b(?:but\s+|and\s+)?(?:here[’'']?s|this\s+is|that[’'']?s)\s+where\s+(?:it|things)\s+gets?\s+(?:interesting|good|tricky|weird|wild|better|crazy|fun)\b'
      - '(?i)(?:^|(?<=[.!?]\s)|(?<=^[-*•]\s))plot\s+twist\s*[:.!]'
    examples:
      positive:
        - "Here's the kicker: the fix took five minutes."
        - "But here's the thing... nobody read the manual."
        - "Here's what nobody tells you about remote work."
        - "The best part: it's free."
        - "That’s where it gets interesting."
      negative:
        - "Here's the build log from Tuesday's failed run."
        - "The best part of the trail is the ridge above the lake."
        - "Here's what the logs show: three timeouts between 14:00 and 14:05."
        - "Nobody tells you the password; it is stored in the vault."
    test_texts:
      - {text: "Big news for the team. Here's the kicker: the launch moved up a week.", expect: no_trigger, context: informal}
      - {text: "Here's the thing: we shipped. And here's the kicker: nobody noticed.", expect: trigger, context: informal}
      - {text: "Big news for the team. Here's the kicker: the launch moved up a week.", expect: trigger}
  de:
    patterns:
      - '(?i)\b(?:und\s+|aber\s+|doch\s+)?(?:hier|jetzt|nun|da)\s+kommt\s+(?:der\s+(?:Clou|Haken|Knackpunkt|Twist|Knaller)|das\s+(?:Beste|Entscheidende|Spannende|Überraschende|Verrückte))\s*[:.!—–]'
      - '(?i)(?:^|(?<=[.!?]\s)|(?<=^[-*•]\s))was\s+(?:die\s+wenigsten|kaum\s+jemand|nur\s+wenige|niemand|die\s+meisten\s+nicht|viele\s+nicht)\s+(?:wissen|weiß|ahnen|ahnt|sagen|sagt|bedenken|bedenkt|verraten|verrät|erzählt|erzählen|wissen\s+dürften)\s*(?::|,\s+ist\b)'
      - '(?i)(?:^|(?<=[.!?]\s)|(?<=^[-*•]\s))das\s+(?:Beste|Spannendste|Verrückteste|Überraschendste|Schönste|Erstaunlichste)(?:\s+(?:daran|dabei|kommt\s+(?:aber\s+)?(?:noch|zum\s+Schluss)))?\s*:'
      - '(?i)\b(?:jetzt|hier|nun|da)\s+wird(?:[’'']s|\s+es)\s+(?:richtig\s+|erst\s+)?(?:spannend|interessant)\b'
      - '(?i)(?:^|(?<=[.!?]\s)|(?<=^[-*•]\s))(?:der\s+(?:Clou|Haken|Knackpunkt|Twist)|die\s+Pointe)\s*:'
    examples:
      positive:
        - "Und hier kommt der Clou: Das Update ist kostenlos."
        - "Was die wenigsten wissen: Die Funktion gibt es schon seit 2019."
        - "Das Beste daran: Es kostet nichts."
        - "Und jetzt wird’s spannend."
        - "Der Haken: Die Lizenz gilt nur ein Jahr."
      negative:
        - "Hier kommt der Bus um 7:40 an."
        - "Der Haken an der Wand hält 20 kg."
        - "Das Beste wäre, den Termin zu verschieben."
        - "Was die meisten Nutzer wissen wollen, steht in der FAQ."
legitimate_use: >
  In explicitly informal short formats such as social media posts a single announcement is
  tolerated; the threshold rises to two hits in the informal context. A transition that leads into
  genuinely surprising data is acceptable when the payoff follows in the same sentence. Flag the
  announcement when it only builds suspense for an ordinary point.
fix: >
  Delete the announcement and state the point directly.
prevention: >
  Do not announce a point before making it ("Here's the kicker", "But here's the thing", "Was die
  wenigsten wissen:"). Make the point.
sources:
  - source: legacy-knowledge-base
    locator: "T1.6, base taxonomy 2026-07-30"
    note: "Legacy exception: in explicitly informal short formats (e.g. social media posts) report only from 2 hits."
  - source: skill-no-ai-slop
    locator: "'Throat-clearing openers', 'Colon reveals', 'Fake-profound kickers'"
    note: "Uses 'Here's what nobody tells you' as an example; confirmations recorded 2026-08-23 and 2026-09-06."
  - source: aipromptindex-io
    locator: "'Faux-Insight Setups', 'Dramatic Colon Reveals', 'Throat-Clearing Openers'"
    note: "Confirmation recorded 2026-09-06."
related:
  - {id: rhetorical-self-answer, relation: distinct-from}
  - {id: announce-then-answer, relation: overlaps}
