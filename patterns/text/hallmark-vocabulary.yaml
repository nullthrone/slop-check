  - {date: 2026-08-02, change: "List update recommendation recorded (Forbes column of 2026-05-21: shift to vaguer verbs); not adopted."}
  - {date: 2026-08-16, change: "Forbes column of 2026-08-10 reconfirms quietly, delve, landscape, journey; list unchanged."}
  - {date: 2026-09-06, change: "Academic support recorded: Kobak et al. (14.2 million PubMed abstracts, 'delves' 25-fold) via SlopDetector.org."}
  - {date: 2026-10-04, change: "Graphite study finds new hallmark vocabulary model- and version-specific; non-adoption of the list update now backed by data."}
  - {date: 2026-10-11, change: "Pebblous secondary analysis adds phrase multipliers from the Graphite data; classic words fall below human level for three newer models."}
  - {date: 2026-11-15, change: "Pangram corpus data confirms (AI phrases 12x, 'delve into' 45x); list unchanged."}
  - {date: 2026-11-17, change: "Migrated to slop-check repository as grandfathered core (provisional). Absorbs legacy T3.2: isolated sub-threshold hits are no longer reported."}
