  - {id: inflated-importance, relation: distinct-from}
  - {id: hallmark-vocabulary, relation: distinct-from}
history:
  - {date: 2026-09-06, change: "Opened as candidate T2.18 with two sources (aipromptindex.io, no-ai-slop skill)."}
  - {date: 2026-09-13, change: "Third source found (workbravely.substack.com)."}
  - {date: 2026-09-20, change: "Admitted to legacy knowledge base core as T2.18 (tier 2) with five sources; list extended with genuinely, to be honest, quite frankly, let's be clear; self-calibrated threshold of at least 3 hits (short texts 2)."}
  - {date: 2026-11-01, change: "Supporting academic evidence recorded (arXiv:2609.23090, booster vocabulary); no change to list, threshold or status."}
  - {date: 2026-11-17, change: "Migrated to slop-check repository as grandfathered core (provisional)."}
notes: >
  The threshold is self-calibrated in the legacy knowledge base by analogy with T2.4; no source
  quantifies it. Expected false-positive risk: "just" and "really" are frequent in ordinary
  English, so the English list may trigger on informal human prose. The legacy knowledge base
  listed English words only; the German list was written at migration from direct equivalents and
  leaves out "einfach" and "eigentlich" because both carry content in most uses. "really" and
  "crucially" come from the cited source lists (stop-slop, workbravely). A broad catalog checked
  on 2026-09-20 did not list the pattern, recorded as negative evidence in the legacy knowledge
  base.
