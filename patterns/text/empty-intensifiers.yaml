    locator: "T2.18 Leere Verstärker-Adverbien (admitted 2026-09-20)"
  - source: aipromptindex-io
    locator: "entry 'Empty Adverbs'"
  - source: skill-no-ai-slop
    locator: "entry 'often-empty adverbs'"
    note: "Nearly identical word list, worded independently."
  - source: workbravely-substack
    locator: "category 'Intensifier Adverbs/Adjectives'"
    note: "importantly, crucially, fundamentally, truly, genuinely; three of the then eight legacy words match exactly. Found 2026-09-13."
  - source: skill-avoid-ai-writing
    locator: "entry 'Hollow intensifiers'"
  - source: skill-stop-slop
    locator: "empty-adverb word list"
    note: "really, just, literally, genuinely, honestly, simply, actually."
  - source: arxiv-2609-23090
    locator: "booster and hedge frequencies in CHI papers"
    note: >
      Broader booster vocabulary rises from 42.5 to 49.4 on the study's own scale (2025 to 2026)
      while hedges stay stable. Supporting evidence for the thesis; it measures a wider linguistic
      category than this word list and was not counted as a further source (2026-11-01).
related:
