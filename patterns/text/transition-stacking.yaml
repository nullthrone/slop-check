history:
  - {date: 2026-09-06, change: "Opened as candidate T2.15 with two to three independent sources and a threshold adopted from SlopDetector (more than 50 % of paragraphs)."}
  - {date: 2026-09-13, change: "Admitted to legacy knowledge base core as T2.15 (tier 2) with four sources (SlopDetector, imperfectly.app, aicheckr.io, fireprompts.io)."}
  - {date: 2026-11-17, change: "Migrated to slop-check repository as grandfathered core (provisional)."}
notes: >
  min_units 2 was added at migration: a single paragraph that opens with a connector would
  otherwise reach 100 %. Demarcation from the legacy knowledge base: participle-padding works at
  sentence end, german-stock-phrases has no position rule and no connector list. The term lists
  extend the legacy examples (Furthermore, Moreover, Additionally, Zudem, Darüber hinaus,
  Außerdem) with further formal connectors; contrastive "however" and "allerdings" are left out on
  purpose because they usually mark a real contrast.
