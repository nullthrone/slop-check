id: function-word-shift
modality: text
name: Function-word shift
summary: >
  A cluster of prepositions and conjunctions becomes more frequent in LLM-assisted English prose:
  "across", "into", "where", "while" and "beyond" ("insights across teams", "beyond the dashboard",
  "while ensuring"). Each word is ordinary; the shift shows only as a density change across a text.
category: lexical
status: observation
detector:
  kind: lexicon
  position: any
threshold:
  min_count: 12
  per_words: 1000
  comparison: gte
  scope: text
  min_units: null
  short_text: {min_words: 100}
requires: null
realizations:
  en:
    terms: [across, into, where, while, beyond]
    examples:
      positive:
        - "We rolled the tool out across all teams, beyond the original pilot group."
        - "The model turns raw logs into insights while keeping costs low."
        - "This is where the new workflow helps."
      negative:
        - "Meanwhile, the team moved the servers to the new data center in May."
        - "Whereas the old process took days, the new one takes an hour."
        - "Elsewhere, the intolerant parser rejected the file."
legitimate_use: >
  These are high-frequency function words; any single use is normal. Only an unusual density over
  a longer text is of interest, and even then technical descriptions of spatial or temporal
  relations use them legitimately.
fix: >
  Check whether "across", "beyond" and "while" carry a literal relation of place or time. Replace
  vague uses with the concrete relation ("in all three teams", "in addition to").
prevention: >
  Use "across", "beyond", "into", "where" and "while" only for their literal relation; prefer the
  concrete phrasing when the relation is vague.
notes: >
  Both sources are arXiv preprints on academic registers. They count as two clusters under
  docs/architecture.md section 5.2 (academic sources cluster by shared authors), but
  kobak-excess-vocabulary corroborates only "across", and no known source describes the shift as
  a nameable trope with example sentences, so the pattern stays an observation. English only, so
  there is no German realization; German equivalents have no evidence yet. The density threshold
  of 12 per 1,000 words is not calibrated against the reference corpora and is expected to misfire
  on many ordinary English texts; it exists to let a measurement test the claim. Related to the
  function-word decline that supports premodifier-stacking.
sources:
  - source: arxiv-2609-23090
    note: >
      Rise of across, into, where, while and beyond in CHI papers since LLM writing aids appeared,
      reported next to the decline of of, a, an, is, are. One edited academic register; the
      authors note that the break coincides with the removal of the CHI page limit in 2021.
  - source: kobak-excess-vocabulary
    locator: "section on the frequency gap, common word set"
    note: >
      "across" (with "within") belongs to the set of ten common excess style words in 2024 PubMed
      abstracts (across, additionally, comprehensive, crucial, enhancing, exhibited, insights,
      notably, particularly, within) whose combined frequency gap gives a lower bound on LLM use.
      Corroborates "across" only.
related:
  - {id: premodifier-stacking, relation: overlaps}
