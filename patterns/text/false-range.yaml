id: false-range
modality: text
name: False range
summary: >
  A "from X to Y" span suggests universality without naming anyone or anything concrete ("From
  startups to Fortune 500s", "Vom Anfänger bis zum Profi", "Von der Idee bis zur Umsetzung"). The
  two endpoints stand in for an audience or a process the text never describes. The "whether
  you're a beginner or a pro" form does the same job.
category: rhetoric
status: core
detector:
  kind: regex
  position: any
threshold:
  min_count: 1
  comparison: gte
  scope: text
requires: null
realizations:
  en:
    patterns:
      - '(?i)\bfrom\s{1,3}(?:(?:small|tiny|early-stage|scrappy|local|individual|first-time)\s{1,3})?(?:start-?ups?|beginners?|novices?|newcomers?|newbies|first-timers|amateurs|hobbyists|solopreneurs|freelancers|small\s{1,3}businesses|SMBs|mom-and-pop\s{1,3}shops|founders|creators)\s{1,3}to\s{1,3}(?:(?:large|global|multinational|established|seasoned|experienced|enterprise|the)\s{1,3}){0,2}(?:Fortune\s{1,3}500s?|enterprises?|corporations|conglomerates|multinationals|experts?|pros|professionals|veterans|power\s{1,3}users|industry\s{1,3}leaders|giants)\b'
      - '(?i)\bfrom\s{1,3}(?:(?:the|an?|your|initial|first|rough|raw|simple)\s{1,3}){0,2}(?:ideas?|concepts?|ideation|inception|vision|sketch|napkin\s{1,3}sketch|spark|first\s{1,3}draft)\s{1,3}(?:all\s{1,3}the\s{1,3}way\s{1,3})?to\s{1,3}(?:(?:full|final|flawless|successful|real-world|the|a)\s{1,3}){0,2}(?:execution|implementation|launch|reality|realization|delivery|market|finished\s{1,3}product|success|scale)\b'
      - '(?i)\bwhether\s{1,3}you(?:[’'']re|\s{1,3}are)\s{1,3}(?:an?\s{1,3})?(?:(?:complete|total|absolute|aspiring|curious)\s{1,3})?(?:beginners?|novices?|newcomers?|first-timers?|start-?ups?|small\s{1,3}business(?:es)?|solopreneurs?|hobbyists?)\b[^.!?\n]{0,40}?\bor\s{1,3}(?:an?\s{1,3})?(?:(?:seasoned|experienced|established|large|global)\s{1,3})?(?:pros?|professionals?|experts?|veterans?|enterprises?|corporations?|Fortune\s{1,3}500)\b'
    examples:
      positive:
        - "From startups to Fortune 500s, teams rely on our platform."
        - "Whether you're a beginner or a seasoned pro, this guide has you covered."
        - "We take your product from idea to launch in record time."
        - "Trusted by everyone from first-time founders to global enterprises."
      negative:
        - "Prices range from $12 to $40 per seat and month."
        - "We migrated the cluster from PostgreSQL 13 to 16 over the weekend."
        - "The course moves from basic syntax to writing a small parser in week six."
        - "Whether you're a student or a professional, the exam fee is 120 euros."
        - "Interns rotate from the support team to the platform team after three months."
  de:
    patterns:
      - '(?i)\bvo(?:m|n)\s{1,3}(?:(?:der|den|kleinen|blutigen|absoluten|jungen|ambitionierten)\s{1,3}){0,2}(?:Anfänger(?:in|n)?|Einsteiger(?:in|n)?|Neuling(?:en)?|Laien|Hobby\w{0,12}|Start-?ups?|Gründer(?:in|n)?|Einzelunternehmer(?:in|n)?|Solo-?Selbstständigen|Mittelständler|Familienbetrieb)\s{1,3}(?:bis\s{1,3}(?:hin\s{1,3})?zu[mr]?|über\s{1,3}[^.!?\n]{1,40}?\s{1,3}bis\s{1,3}(?:hin\s{1,3})?zu[mr]?)\s{1,3}(?:(?:erfahrenen|großen|internationalen|globalen|etablierten|gestandenen)\s{1,3}){0,2}(?:Profis?|Experten?|Expertin(?:nen)?|Fortgeschrittenen|Konzern(?:en)?|Großunternehmen|DAX-Konzern(?:en)?|Weltkonzern(?:en)?|Weltmarktführer)\b'
      - '(?i)\bvo(?:n\s{1,3}der|m)\s{1,3}(?:(?:ersten|groben|kreativen|initialen|bloßen)\s{1,3})?(?:Idee|Ideenfindung|Konzeption|Konzept|Vision|Skizze|Planung|Entwurf)\s{1,3}(?:bis\s{1,3}(?:hin\s{1,3})?zu[mr]?|über\s{1,3}[^.!?\n]{1,40}?\s{1,3}bis\s{1,3}(?:hin\s{1,3})?zu[mr]?)\s{1,3}(?:(?:erfolgreichen|fertigen|finalen|konkreten|reibungslosen|praktischen)\s{1,3})?(?:Umsetzung|Realisierung|Markteinführung|Marktreife|Produkt|Launch|Implementierung|Serienreife)\b'
      - '(?i)\b(?:egal|ganz\s{1,3}gleich|unabhängig\s{1,3}davon),?\s{1,3}ob\s{1,3}(?:(?:du|Sie)\s{1,3})?(?:(?:ein|eine|einen)\s{1,3})?(?:Anfänger(?:in)?|Einsteiger(?:in)?|Neuling|Laie|Start-?up|Gründer(?:in)?|kleines\s{1,3}Unternehmen|Einzelunternehmer(?:in)?|Hobby\w{0,12})\b[^.!?\n]{0,40}?\boder\s{1,3}(?:(?:ein|eine|einen)\s{1,3})?(?:(?:erfahrene[rn]?|gestandene[rn]?|große[sn]?|internationale[rn]?)\s{1,3})?(?:Profi|Experte|Expertin|Konzern|Großunternehmen|Fortgeschrittene[rn]?)\b'
    examples:
      positive:
        - "Vom Anfänger bis zum Profi: Unser Kurs holt jeden ab."
        - "Von der Idee bis zur Umsetzung begleiten wir Sie."
        - "Vom Start-up bis zum DAX-Konzern vertrauen Unternehmen auf unsere Lösung."
        - "Egal ob Einsteiger oder Profi, hier findet jeder das passende Werkzeug."
      negative:
        - "Der Zug fährt ohne Halt von Berlin bis München."
        - "Die Preise reichen von 12 bis 40 Euro pro Lizenz."
        - "Von der Idee hat das Team erst nach dem Review erfahren."
        - "Vom Anfänger wird erwartet, dass er die Grundlagen der Statik kennt."
        - "Egal ob die Datei leer ist oder fehlt, das Skript bricht mit Code 2 ab."
legitimate_use: >
  A range is fine when both endpoints are real and supported, for example a customer list that
  names a startup and a listed corporation, or a syllabus that starts at zero and states the
  advanced level it ends at. Literal ranges (prices, versions, distances, dates) are outside the
  pattern.
fix: >
  Name the actual audience or the actual stages, with examples or numbers, or delete the phrase.
prevention: >
  Do not claim universality with "from X to Y" spans such as "from startups to Fortune 500s", "vom
  Anfänger bis zum Profi" or "von der Idee bis zur Umsetzung", and avoid "whether you're a
  beginner or a pro". Name the concrete audience or the concrete steps.
sources:
  - source: maintainer-observation
  - source: aicheckr-io
    locator: "before/after examples"
related:
  - {id: triad, relation: overlaps}
notes: >
  The "whether ... or ..." and "egal ob ... oder ..." regexes cover a variant that German-language
  guides to AI writing describe; those guides are not registered as sources. Chains of three
  ("from X to Y to Z") also count toward triad. Endpoint lists are closed vocabularies for
  precision; unusual endpoints need host-model review.
