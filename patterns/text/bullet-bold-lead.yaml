id: bullet-bold-lead
modality: text
name: Bullet with bold lead
summary: >
  Lists whose items consistently start with a bold keyword and a colon, followed by a sentence that
  paraphrases the keyword ("**Speed:** The new engine is faster.").
category: formatting
status: core
provisional: true
legacy_id: T2.3
legacy_tier: 2
detector:
  kind: metric
  position: any
  metric: bullet_bold_lead
  params: {}
threshold:
  value: {op: gte, x: 2}
requires: null
realizations:
  "*":
    examples:
      positive:
        - "- **Speed:** The new engine is faster.\n- **Security:** All data is encrypted at rest."
        - "* **Geschwindigkeit:** Die neue Engine ist schneller.\n* **Sicherheit:** Alle Daten werden verschlüsselt."
        - "- **Cost**: Lower than before.\n- **Support**: Available around the clock."
      negative:
        - "- Speed: the new engine is faster.\n- Security: all data is encrypted at rest."
        - "**Speed:** The new engine is faster than the old one, according to the March benchmark."
        - "- Install **pgvector** first.\n- Then run **make test**."
        - "- Geschwindigkeit: Die neue Engine ist schneller.\n- Sicherheit: Alle Daten werden verschlüsselt."
legitimate_use: >
  Reference material such as glossaries or API parameter lists legitimately pairs a bold term with
  its definition. Flag the shape when the bold lead only labels a sentence that
  paraphrases it and continuous prose would carry the content better.
fix: >
  Turn the list into prose, or remove the bold and keep only items that carry distinct information.
prevention: >
  Do not format lists as "**Keyword:** sentence". Write prose, or use plain bullets when the items
  are truly parallel.
sources:
  - source: legacy-knowledge-base
    locator: "T2.3, base taxonomy 2026-07-30"
  - source: aicheckr-io
    note: "Confirmation recorded 2026-08-23."
related:
  - {id: bullet-list-preference, relation: distinct-from}
  - {id: markdown-emphasis-inflation, relation: distinct-from}
  - {id: emoji-decoration, relation: distinct-from}
history:
  - {date: 2026-07-30, change: "Added to legacy knowledge base core as T2.3 (tier 2; at least 2 such bullets within one list)."}
  - {date: 2026-08-23, change: "aicheckr.io confirms the pattern."}
  - {date: 2026-11-15, change: "Pangram's general bullet-list preference (9x) recorded as a separate single-source observation, distinct from this bold-lead shape."}
  - {date: 2026-11-17, change: "Migrated to slop-check repository as grandfathered core (provisional) with the bullet_bold_lead metric."}
