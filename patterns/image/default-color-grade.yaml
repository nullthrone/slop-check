  - source: atlantic-why-ai-art-looks
    locator: "description of the default look"
    note: "Colors 'bright and saturated'."
  - source: kellogg-insight-ai-photo-signs
    locator: "sign 2, stylistic artifacts"
    note: "'excessive saturation'."
