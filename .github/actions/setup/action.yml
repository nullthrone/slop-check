name: Set up Python and slop-check
description: Install Python 3.12 and the repository with its dev dependencies (pip install -e ".[dev]").
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install slop-check with dev dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
