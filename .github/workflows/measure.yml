# Monthly measurement: refresh the corpora, measure every text pattern on the holdout split,
# write measurements and a report to branch data, open or update the monthly issue, then
# rebuild and release the package with the new weights.
#
# Two jobs, so that no job holds both the API key and a token that can push:
# - measure holds OPENROUTER_API_KEY and a read-only token, and hands its results over as an
#   artifact;
# - publish holds the write token and no key; it commits the results to branch data (only the
#   spend ledger if the measurement failed), opens the issue and dispatches release.
# The run holds the concurrency group "openrouter-budget", which every job that calls OpenRouter
# shares (llm-eval.yml, conformance.yml), so it reads budget/ledger.json only after the previous
# spender has written it. GitHub keeps one pending run per group and cancels it when a newer one
# queues, so the schedule repeats daily in the first week and skips once the month is measured.
name: measure

on:
  schedule:
    - cron: "23 2 1-7 * *"
  workflow_dispatch:
    inputs:
      generate_ai:
        description: Generate missing AI corpus documents (spends budget)
        type: boolean
        default: true
      release:
        description: Dispatch release.yml with a catalog release afterwards
        type: boolean
        default: true

permissions: {}

concurrency:
  group: openrouter-budget
  cancel-in-progress: false

jobs:
  measure:
    if: github.repository == 'nullthrone/slop-check'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    outputs:
      run: ${{ steps.data.outputs.run }}
      date: ${{ steps.data.outputs.date }}
      staged: ${{ steps.collect.outputs.staged }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GENERATE_AI: ${{ github.event_name == 'schedule' || inputs.generate_ai }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Read only now, while this run holds the openrouter-budget group.
      - name: Read branch data
        id: data
        run: |
          date=$(date -u +%Y-%m-%d)
          {
            echo "STAGE=$RUNNER_TEMP/stage"
            echo "DATE=$date"
          } >> "$GITHUB_ENV"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          python .github/scripts/data_branch.py checkout --branch data --dir "$RUNNER_TEMP/stage"
          if [ "$EVENT" = schedule ] && compgen -G "$RUNNER_TEMP/stage/measurements/reports/${date%-*}-*.md" > /dev/null; then
            echo "This month is measured already; later scheduled runs only catch up a missed one."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning title=No API key::OPENROUTER_API_KEY is not set. AI corpus generation and llm patterns are skipped."
          fi

      - name: Model lock
        if: steps.data.outputs.run == 'true'
        run: |
          if [ ! -f "$STAGE/models/lock.json" ]; then
            echo "No models/lock.json on branch data; resolving now."
            slopcheck-dev models resolve --out "$STAGE/models/lock.json"
          fi

      - name: Fetch human corpus
        if: steps.data.outputs.run == 'true'
        run: |
          slopcheck-dev corpus fetch-human --out .corpus/human
          mkdir -p "$STAGE/corpus/human"
          cp .corpus/human/manifest.json "$STAGE/corpus/human/manifest.json"

      - name: Generate missing AI corpus documents
        if: steps.data.outputs.run == 'true' && env.GENERATE_AI == 'true' && env.OPENROUTER_API_KEY != ''
        run: |
          set +e
          slopcheck-dev corpus generate-ai --human .corpus/human --out "$STAGE/corpus/ai" \
            --lock "$STAGE/models/lock.json" --ledger "$STAGE/budget/ledger.json" --run-kind scheduled
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::warning title=Budget::Budget cap reached during corpus generation; the corpus is partial."
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: Measure all text patterns on the holdout split
        if: steps.data.outputs.run == 'true'
        run: |
          previous=()
          if [ -f "$STAGE/measurements/measurements.json" ]; then
            previous=(--measurements "$STAGE/measurements/measurements.json")
          fi
          llm=()
          if [ -n "$OPENROUTER_API_KEY" ]; then llm=(--llm); fi
          mkdir -p "$STAGE/measurements/reports"
          set +e
          slopcheck-dev measure --human .corpus/human --ai "$STAGE/corpus/ai" --split holdout "${llm[@]}" \
            --lock-filter --lock "$STAGE/models/lock.json" --ledger "$STAGE/budget/ledger.json" \
            --run-kind scheduled "${previous[@]}" \
            --out "$STAGE/measurements/measurements.json" --report "$STAGE/measurements/reports/$DATE.md"
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::warning title=Budget::Budget cap reached while judging llm patterns; they are missing from this measurement."
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          cat "$STAGE/measurements/reports/$DATE.md" >> "$GITHUB_STEP_SUMMARY"

      # Also after a failure, so that publish can record what was spent.
      - name: Collect the files for branch data
        id: collect
        if: always() && steps.data.outputs.run == 'true'
        run: |
          out=$RUNNER_TEMP/out
          mkdir -p "$out"
          cd "$STAGE"
          for p in measurements/measurements.json "measurements/reports/$DATE.md" corpus/ai \
                   corpus/human/manifest.json models/lock.json budget/ledger.json; do
            if [ -e "$p" ]; then cp -a --parents "$p" "$out/"; fi
          done
          if [ -n "$(ls -A "$out")" ]; then echo "staged=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.collect.outputs.staged == 'true'
        with:
          name: measure-out
          path: ${{ runner.temp }}/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: measure
    if: always() && github.repository == 'nullthrone/slop-check' && needs.measure.outputs.staged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      DATE: ${{ needs.measure.outputs.date }}
      MEASURED: ${{ needs.measure.result == 'success' }}
      RELEASE: ${{ github.event_name == 'schedule' || inputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: measure-out
          path: ${{ runner.temp }}/out

      - name: Commit to branch data
        run: |
          if [ "$MEASURED" = true ]; then
            python3 .github/scripts/data_branch.py publish --branch data --source "$RUNNER_TEMP/out" \
              --path measurements/measurements.json --path "measurements/reports/$DATE.md" \
              --path corpus/ai --path corpus/human/manifest.json --path models/lock.json \
              --ledger budget/ledger.json --message "Measurement $DATE"
          else
            # the measurement failed; its spend still belongs in the ledger
            python3 .github/scripts/data_branch.py publish --branch data --source "$RUNNER_TEMP/out" \
              --ledger budget/ledger.json --message "Record spend of failed measurement $DATE"
          fi

      - name: Open or update the monthly issue
        if: env.MEASURED == 'true'
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          title="Measurement report ${DATE%-*}"
          {
            cat "$RUNNER_TEMP/out/measurements/reports/$DATE.md"
            echo
            echo "Data: branch \`data\`, \`measurements/reports/$DATE.md\`. Run: $SERVER/$REPO/actions/runs/$RUN_ID"
          } > "$RUNNER_TEMP/issue.md"
          number=$(gh issue list --state all --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Rebuild and release the package
        if: env.MEASURED == 'true' && env.RELEASE == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run release.yml --ref "$DEFAULT_BRANCH" -f "release_tag=catalog-$DATE"
