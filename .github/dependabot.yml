version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directories:
      - /
      - /constraints  # hash-pinned lock that every workflow installs from
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ["*"]
