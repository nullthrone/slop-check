# Admission thresholds, weights, provisional verdict thresholds, budget and initial core.
# Protected by CODEOWNERS: changing this file changes the gate.
# Semantics: docs/architecture.md sections 5 and 6.

short_text_max_words: 150

admission:
  observation:
    min_sources: 1
  candidate:
    min_independent_sources: 2
    min_examples_per_language:
      positive: 2
      negative: 2
    # Pull request gate on the dev split (deterministic detectors in ci.yml, llm detectors in llm-eval.yml)
    pr_gate:
      max_fpr_human: 0.15
      llm_min_positive_recall: 0.8     # judge must flag >= 80 % of positive examples
      llm_max_negative_flag_rate: 0.2  # judge may flag <= 20 % of negative examples
  core:
    # Applied on the holdout split by the scheduled measurement, and on the dev split
    # when a pull request edits a pattern that is currently effective core.
    max_fpr_human: 0.05
    min_lift: 2.0
    min_model_families: 2
    min_family_lift: 1.5
    min_ai_hits: 10
    min_human_docs_per_language: 100
  fading:
    # Hysteresis: a core pattern is demoted only if it clearly fails.
    max_lift: 1.5
    min_fpr_human: 0.08

weights:
  from_lift:
    fn: ln
    min: 0.5
    max: 3.0

# Verdict thresholds used until the first measurement provides measured ones.
verdict_provisional:
  yellow: 2.0
  red: 5.0

budget:
  # Hard cap, about 25 EUR per month (conservative conversion).
  monthly_usd_cap: 26.0
  per_pull_request_usd_cap: 0.50
  per_scheduled_run_usd_cap: 12.0
  conformance_run_usd_cap: 6.0

# Initial core: patterns that start as status core with a provisional weight.
# The first measurement that covers a pattern replaces its provisional weight with a
# measured one or demotes the pattern to fading. Only IDs listed here may declare status: core.
initial_core:
  antithesis-template: 2.5
  sycophant-residue: 2.5
  cya-disclaimer: 2.5
  concession-pivot: 2.5
  generic-opening: 2.5
  compulsive-summary: 2.5
  payoff-announcement: 2.5
  fragment-pathos: 2.5
  triad: 1.0
  em-dash-inflation: 1.0
  curly-quotes: 1.0
  bullet-bold-lead: 1.0
  hallmark-vocabulary: 1.0
  participle-padding: 1.0
  inflated-importance: 1.0
  brochure-tone: 1.0
  false-range: 1.0
  german-stock-phrases: 1.0
  uniform-rhythm: 1.0
  nominalization-density: 1.0
  transition-stacking: 1.0
  hollow-sentences: 1.0
  synonym-cycling: 1.0
  empty-intensifiers: 1.0
  false-agency: 1.0
  emoji-decoration: 1.0
  vague-attribution: 0.5
