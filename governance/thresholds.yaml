# Admission thresholds, weights, verdict bootstrap and budget.
# Protected by CODEOWNERS: changing this file changes the gate.
# Semantics: docs/architecture.md sections 5 and 6.

short_text_max_words: 150

admission:
  observation:
    min_sources: 1
  candidate:
    min_independent_sources: 2
    min_examples_per_language:
      positive: 2
      negative: 2
    # Pull request gate on the dev split (deterministic detectors in ci.yml, llm detectors in llm-eval.yml)
    pr_gate:
      max_fpr_human: 0.15
      llm_min_positive_recall: 0.8     # judge must flag >= 80 % of positive examples
      llm_max_negative_flag_rate: 0.2  # judge may flag <= 20 % of negative examples
  core:
    # Applied on the holdout split by the scheduled measurement, and on the dev split
    # when a pull request edits a pattern that is currently effective core.
    max_fpr_human: 0.05
    min_lift: 2.0
    min_model_families: 2
    min_family_lift: 1.5
    min_ai_hits: 10
    min_human_docs_per_language: 100
  fading:
    # Hysteresis: a core pattern is demoted only if it clearly fails.
    max_lift: 1.5
    min_fpr_human: 0.08

weights:
  from_lift:
    fn: ln
    min: 0.5
    max: 3.0
  # Bootstrap weights for grandfathered legacy core patterns until first measurement.
  # Chosen so that the legacy traffic-light rules are reproduced exactly:
  # GREEN: 0 tier-1 and <= 1 tier-2; YELLOW: 1 tier-1 or 2-4 tier-2;
  # RED: >= 2 tier-1 or >= 5 tier-2 or (1 tier-1 + >= 3 tier-2).
  bootstrap:
    legacy_tier_1: 2.5
    legacy_tier_2: 1.0
    legacy_tier_3: 0.5

verdict_bootstrap:
  yellow: 2.0
  red: 5.0

budget:
  # Hard cap, about 25 EUR per month (conservative conversion).
  monthly_usd_cap: 26.0
  per_pull_request_usd_cap: 0.50
  per_scheduled_run_usd_cap: 12.0
  conformance_run_usd_cap: 6.0

# Legacy knowledge base core (state 2026-11-15), migrated with status core and provisional: true.
# Only IDs listed here may declare status: core.
grandfathered_core:
  - antithesis-template      # T1.1
  - sycophant-residue        # T1.2
  - cya-disclaimer           # T1.3
  - concession-pivot         # T1.3 (example group since 2026-08-16, split for measurement)
  - generic-opening          # T1.4
  - compulsive-summary       # T1.5
  - payoff-announcement      # T1.6
  - fragment-pathos          # T1.7
  - triad                    # T2.1
  - em-dash-inflation        # T2.2
  - curly-quotes             # T2.2 (typography artifacts, split for measurement)
  - bullet-bold-lead         # T2.3
  - hallmark-vocabulary      # T2.4 (absorbs T3.2)
  - participle-padding       # T2.5
  - inflated-importance      # T2.6
  - brochure-tone            # T2.7
  - false-range              # T2.8
  - german-stock-phrases     # T2.9
  - uniform-rhythm           # T2.10
  - nominalization-density   # T2.11
